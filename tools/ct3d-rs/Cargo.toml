[package]
name = "ct3d-viewer"
version = "0.1.0"
edition = "2021"
description = "치과 CT(DICOM)나 CT에서 뽑은 메시(GLB)를 3D로 보는 egui 데스크톱 뷰어"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
gltf = "1.4"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
meshopt = "0.7"
rayon = "1"
fast-surface-nets = "0.2"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-pixeldata = { version = "0.10", features = ["ndarray"] }

[profile.release]
debug = false
