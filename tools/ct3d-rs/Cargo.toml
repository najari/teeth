[package]
name = "ct3d-viewer"
version = "0.1.0"
edition = "2021"
description = "치과 CT(DICOM)나 CT에서 뽑은 메시(GLB)를 3D로 보는 egui 데스크톱 뷰어"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
gltf = "1.4"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

# CT 처리(DICOM, AI 분할 결과, 메시 만들기)는 데스크톱에서만 한다. 웹 빌드는 GLB를 보기만 한다
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = "0.7"
rayon = "1"
fast-surface-nets = "0.2"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-pixeldata = { version = "0.10", features = ["ndarray"] }
nifti = { version = "0.18", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "HtmlCanvasElement", "Response", "Navigator", "console"] }
wgpu = { version = "30", default-features = false, features = ["webgl", "webgpu", "wgsl"] }

[profile.release]
debug = false

# 웹 빌드용: 크기를 줄인다 (cargo build --profile web --target wasm32-unknown-unknown)
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

